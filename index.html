<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>WhiteBird Exchange</title>
  <style>
    html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        min-width: 360px;
        background: #fff;
    }

    #wbExchangeSdkWrapper {
        width: 100%;
        min-width: 360px;
        height: 100%;
        background: #fff;
    }

    .wb-error {
        box-sizing: border-box;
        display: flex;
        flex-direction: column;
        height: 100%;
        padding: 24px 16px 16px;
        font-family: -apple-system, BlinkMacSystemFont, "Roboto", "Segoe UI", sans-serif;
        color: #1a1a1a;
    }

    .wb-error__content {
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
    }

    .wb-error__title {
        font-size: 20px;
        font-weight: 600;
        margin-bottom: 8px;
    }

    .wb-error__text {
        font-size: 15px;
        color: #6b6b6b;
    }

    .wb-error__actions {
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .wb-error__btn {
        width: 100%;
        height: 48px;
        border: none;
        border-radius: 12px;
        font-size: 16px;
        font-weight: 500;
        background: #f0f0f0;
        color: #1a1a1a;
        cursor: pointer;
    }

    .wb-error__btn--primary {
        background: #1a1a1a;
        color: #fff;
    }

    .wb-error__code {
        margin-top: 12px;
        text-align: center;
        font-size: 12px;
        color: #a0a0a0;
    }
  </style>
</head>
<body>
  <div id="wbExchangeSdkWrapper"></div>

  <script
    src="https://sdk.dev.wbdevel.net/v2.0/integration/wbExchangeSdk-v001.js"
  ></script>
  <script src="main.js"></script>
</body>
</html>
